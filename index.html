<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f9f8f5; --ink:#1d2127; --muted:#666c75; --faint:#9aa0a8;
  --line:#e3e1db; --accent:#1f4e79; --accent-soft:#e3ecf5; --bar:#2f6497; --bar-2:#9db8d3;
  --warn:#a5461f; --warn-soft:#fbefe8; --ok:#2f6b4f;
  --s1:#a5461f; --s2:#7a5a00; --s3:#1f4e79; --s4:#6a3d8f; --s5:#2f6b4f; --s6:#8a3555; --s7:#55606e; --s8:#0f6e7a; --s9:#8a6d00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --surface:#1d2126; --surface-2:#22272d; --ink:#e7e9ec; --muted:#a3a9b1; --faint:#737a83;
    --line:#2f353c; --accent:#8fb8e0; --accent-soft:#233548; --bar:#6c9ccc; --bar-2:#3b5874;
    --warn:#e39572; --warn-soft:#33241d;
    --s1:#e39572; --s2:#d6b55a; --s3:#8fb8e0; --s4:#c09ae0; --s5:#86c7a5; --s6:#e08fae; --s7:#a3acb8; --s8:#6fc6d1; --s9:#e0c45a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1d2126; --surface-2:#22272d; --ink:#e7e9ec; --muted:#a3a9b1; --faint:#737a83;
  --line:#2f353c; --accent:#8fb8e0; --accent-soft:#233548; --bar:#6c9ccc; --bar-2:#3b5874;
  --warn:#e39572; --warn-soft:#33241d;
  --s1:#e39572; --s2:#d6b55a; --s3:#8fb8e0; --s4:#c09ae0; --s5:#86c7a5; --s6:#e08fae; --s7:#a3acb8; --s8:#6fc6d1; --s9:#e0c45a;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button,select,a,[data-f],[data-ir],tr.row,.mrow{touch-action:manipulation}
.wrap{max-width:1280px;margin:0 auto;padding:0 calc(20px + var(--sar)) 0 calc(20px + var(--sal))}
header.top{padding:calc(18px + var(--sat)) 0 12px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.flag{flex:0 0 auto;width:44px;height:31px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:block}
header.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;min-height:34px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.fbar{display:flex;gap:8px;align-items:center}
.fbar input[type=search]{flex:1 1 auto;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);-webkit-appearance:none;appearance:none}
.fpanel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fpanel select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:220px}
.periodo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.periodo select{max-width:130px}
.count{color:var(--muted);font-size:13px;white-space:nowrap;margin-left:auto}
#bFiltros{display:none}
#bFiltros .n[hidden]{display:none}
#bFiltros .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--surface);font-size:11px;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 7px 4px 10px;font-size:12px;border:0;cursor:pointer}
.chip b{font-weight:600}
.chip span.x{font-size:15px;line-height:1;opacity:.7}
main{padding:16px 0 30px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.kpi .h{color:var(--faint);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;font-weight:650;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--faint);font-size:11.5px}
.card h2 .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto}
.card h2 .seg button{border:0;background:none;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.card h2 .seg button.on{background:var(--accent-soft);color:var(--accent)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
/* leitura rápida */
.insights{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 22px}
.insights li{position:relative;padding:6px 0 6px 16px;font-size:13.5px;border-top:1px solid var(--line)}
.insights li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.insights li.lk{cursor:pointer}
.insights li.lk:hover{color:var(--accent)}
.insights b{font-weight:650}
/* barras horizontais */
.hbars{display:flex;flex-direction:column;gap:5px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;cursor:pointer;border-radius:6px;padding:2px 4px;margin:0 -4px}
.hb:hover{background:var(--surface-2)}
.hb.on{background:var(--accent-soft)}
.hb .n{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--bar);border-radius:3px}
.hb .q{font-size:12px;color:var(--muted);text-align:right;min-width:64px}
.more{margin-top:6px;background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:4px 0}
/* colunas por dia */
.colsw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cols{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:18px;min-width:min-content}
.col{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:46px}
.col .bar{width:100%;max-width:64px;background:var(--bar);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.col .bar .lab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap}
.col .vb{width:100%;max-width:64px;height:8px;margin-top:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.col .vb i{display:block;height:100%;background:var(--s1)}
.col .d{font-size:12px;margin-top:5px;font-weight:600}
.col .w{font-size:11px;color:var(--faint);white-space:nowrap}
.col:hover .bar{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* listas */
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.toplist li:first-child{border-top:0}
.toplist li:hover .tt{color:var(--accent)}
.toplist .tt{font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toplist .mm{font-size:11.5px;color:var(--muted)}
.toplist .vv{font-weight:600;white-space:nowrap;font-size:13px}
/* sinais */
.tag{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;margin:1px 3px 1px 0;opacity:.95}
/* tabela */
.tablecard{padding:0;overflow:hidden}
.tablehead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.tablehead h2{margin:0;font-size:13px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;user-select:none;-webkit-user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
th .ar{opacity:.6;font-size:10px}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.row.open td{background:var(--accent-soft)}
td.num{text-align:right;white-space:nowrap;font-weight:550}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.small{font-size:12px;color:var(--muted);white-space:nowrap}
td.pg{font-size:12px;white-space:nowrap}
td.pg .ed{color:var(--faint);display:block;font-size:11px}
a.pglink{color:var(--accent);text-decoration:none}
a.pglink:hover{text-decoration:underline}
tr.det td{background:var(--surface-2);padding:12px 14px 16px}
.det-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:760px){.det-grid{grid-template-columns:1fr}}
.det-grid h4{margin:0 0 3px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.det-grid p{margin:0 0 10px;white-space:pre-line;overflow-wrap:anywhere}
.det-grid dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.det-grid dt{color:var(--muted)}
.det-grid dd{margin:0;overflow-wrap:anywhere}
.motivo{border-left:3px solid var(--warn);padding-left:10px}
mark{background:#ffe58a;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6b5a14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:#6b5a14}}
.pager{display:flex;justify-content:center;padding:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* lista em cartões (celular) */
.mlist{display:flex;flex-direction:column}
.mrow{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow.open{background:var(--accent-soft)}
.mrow .mt{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.mrow .mt b{color:var(--ink);font-weight:600}
.mrow .md{font-size:14px;margin:4px 0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mrow .mc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mrow .mv{font-weight:650;white-space:nowrap;color:var(--ink);font-size:13px}
.mrow .mg{margin-top:5px}
.mdet{padding:12px 14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
/* dia */
.daystrip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:4px;margin-bottom:12px;align-items:stretch}
.daypill{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;text-align:left;min-width:86px;scroll-snap-align:start}
.daypill .d{font-weight:650}
.daypill .m{font-size:11.5px;color:var(--muted)}
.daypill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.daypill[aria-pressed="true"] .d{color:var(--accent)}
.nav{flex:0 0 auto;width:36px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.dayhead h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.dayhead .m{color:var(--muted)}
/* destaques */
.hl{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.hlc{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.hlc .hd{padding:12px 14px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hlc .rk{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.hlc .v{font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.2}
.hlc .og{text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.hlc .og b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
.hlc .bd{padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.hlc .sec h5{margin:0 0 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.hlc .sec p{margin:0;font-size:13px;overflow-wrap:anywhere}
.hlc .why{background:var(--warn-soft);border-radius:8px;padding:9px 11px}
.hlc .why h5{color:var(--warn)}
.hlc .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.hlc .meta b{color:var(--ink);font-weight:600}
.hlc .ft{padding:0 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hlc .ft button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:4px 0}
footer.note{font-size:12px;color:var(--faint);padding:8px 0 calc(24px + var(--sab))}
/* apresentação */
body.present{font-size:15.5px}
body.present .kpi .v{font-size:28px}
body.present td{font-size:14.5px}
@media print{
  .filters,.actions,.tabs,.pager,.nav{display:none!important}
  body{background:#fff}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  table{min-width:0}
}
/* ===== celular ===== */
@media (max-width:700px){
  .wrap{padding:0 calc(14px + var(--sar)) 0 calc(14px + var(--sal))}
  header.top{gap:10px;padding-bottom:8px}
  header.top h1{font-size:16.5px}
  .flag{width:38px;height:27px}
  .actions{width:100%}
  .actions .btn{flex:1}
  #bApr{display:none}
  .filters{padding:8px 0}
  .fbar input[type=search],.fpanel select{font-size:16px} /* evita o zoom automático do iPhone */
  #bFiltros{display:inline-flex;align-items:center;flex:0 0 auto;min-height:38px}
  .fbar input[type=search]{min-height:38px}
  .fpanel{display:none;flex-direction:column;align-items:stretch}
  .filters.aberto .fpanel{display:flex}
  .fpanel select{max-width:none;width:100%;min-height:40px}
  .periodo{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px}
  .periodo select{max-width:none}
  .count{margin-left:0;text-align:right}
  .tab{flex:1;padding:11px 8px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:19px}
  .kpi .h{font-size:11.5px}
  .card{padding:12px}
  .card.tablecard{padding:0}
  .hb{grid-template-columns:minmax(80px,42%) 1fr auto;padding:4px}
  .hb .q{min-width:52px}
  .insights{grid-template-columns:1fr}
  .nav{display:none}
  .dayhead h2{font-size:18px}
  .hl{grid-template-columns:1fr}
  .cols{height:170px}
}
</style>
</head>

  {k:'alto', nome:'Acima de R$ 1 mi',      cor:'--s6', teste:a=>!a.orc && a.valor >= CONFIG.valorAlto},
  {k:'slic', nome:'Sem licitação própria', cor:'--s4', teste:a=>CONFIG.tiposSemLicitacao.includes(a.tipo)},
  {k:'sval', nome:'Extrato sem valor',     cor:'--s7', teste:a=>a.valor==null && CONFIG.tiposComValorEsperado.includes(a.tipo)},
  {k:'rep',  nome:'Republicação/errata',   cor:'--s5', teste:a=>/republica|retifica|errata|para corre/i.test(a.descricao+' '+a.obs)},
  {k:'rec',  nome:'Contratada recorrente', cor:'--s5', teste:a=>a.recorrente},
  {k:'opc',  nome:'Operação de crédito',   cor:'--s8', teste:a=>/fonte\s*754|opera[cç][aã]o de cr[eé]dito|empr[eé]stimo/i.test(a.descricao+' '+a.motivo+' '+a.obs)},
  {k:'999',  nome:'Valor terminado em 999',cor:'--s9', teste:a=>!a.orc && a.valor>=10000 && Math.floor(a.valor)%1000===999},
];

/* ====== utilidades ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAcento = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const DIAS_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_SEM_L = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const dt = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const fData = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '—';
const fDM = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7) : '—';
const fBRL = v => v==null ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
function fCurto(v){
  if(v==null||v===0) return '—';
  const a=Math.abs(v);
  if(a>=1e9) return 'R$ '+(v/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2})+' bi';
  if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';
  return fBRL(v);
}
const fN = n => n.toLocaleString('pt-BR');
const fPct = x => (x*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%';
const diffDias = (a,b) => Math.round((dt(b)-dt(a))/864e5);
const normNome = s => semAcento(s).replace(/\b(ltda|s\/?a|eireli|me|epp|cia)\b/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const mediana = l => { if(!l.length) return null; const s=[...l].sort((a,b)=>a-b), m=s.length>>1; return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2); };
const curta = (s,n=70) => { s=String(s||''); return s.length>n ? s.slice(0,n).replace(/\s+\S*$/,'')+'…' : s; };
function fPag(a){ const p=(a.pagina||'').trim(); if(!p) return ''; return /p\.|supl|pág/i.test(p) ? p : 'p. '+p; }
function linkPag(a, texto){
  if(!CONFIG.linkEdicao || !a.edicao) return texto;
  const pg = ((a.pagina||'').match(/\d+/)||[''])[0];
  const url = CONFIG.linkEdicao.replace('{edicao}',encodeURIComponent(a.edicao)).replace('{pagina}',pg);
  return `<a class="pglink" href="${esc(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${texto}</a>`;
}

/* ====== preparo ====== */
const ATOS = (PACOTE?.atos||[]).map(a=>({...a}));
const ANO_FIM = +CONFIG.fimMandato.slice(0,4);
const FAIXAS_VIG = [
  {k:'v0', nome:'Até '+fData(CONFIG.fimMandato), t:v=>v<=CONFIG.fimMandato},
  {k:'v1', nome:'1º semestre de '+(ANO_FIM+1), t:v=>v<=`${ANO_FIM+1}-06-30`},
  {k:'v2', nome:'2º semestre de '+(ANO_FIM+1), t:v=>v<=`${ANO_FIM+1}-12-31`},
  {k:'v3', nome:(ANO_FIM+2)+' ou depois', t:()=>true},
];
const FAIXAS_ATR = [
  {k:'a0', nome:'Até 3 dias', t:d=>d<=3},
  {k:'a1', nome:'4 a 10 dias', t:d=>d<=10},
  {k:'a2', nome:'11 a 30 dias', t:d=>d<=30},
  {k:'a3', nome:'31 a 90 dias', t:d=>d<=90},
  {k:'a4', nome:'Mais de 90 dias', t:()=>true},
];
(function preparar(){
  const dias = {};
  ATOS.forEach(a=>{
    if(!a.contratada) return;
    const k = normNome(a.contratada.split(/[;(]/)[0]);
    if(k.length<4 || /^(varios|diversos|fundos|nao)/.test(k)) return;
    a._ck = k; (dias[k] ||= new Set()).add(a.dia);
  });
  ATOS.forEach(a=>{
    a.orc = CONFIG.tiposOrcamentarios.includes(a.tipo);
    a.atraso = (a.data_ato && a.data_pub) ? diffDias(a.data_ato,a.data_pub) : null;
    a.recorrente = !!(a._ck && dias[a._ck].size>1);
    a.sinais = SINAIS.filter(s=>s.teste(a)).map(s=>s.k);
    a.fvig = a.vigencia ? FAIXAS_VIG.find(f=>f.t(a.vigencia)).k : null;
    a.fatr = a.atraso!=null && a.atraso>=0 ? FAIXAS_ATR.find(f=>f.t(a.atraso)).k : null;
    a._busca = semAcento([a.descricao,a.contratada,a.motivo,a.obs,a.orgao,a.tipo,a.edicao,a.n,a.pagina].join(' '));
  });
})();
const DIAS = [...new Set(ATOS.map(a=>a.dia).filter(Boolean))].sort();
const EDICAO_DIA = {}; ATOS.forEach(a=>{ if(a.edicao) (EDICAO_DIA[a.dia] ||= new Set()).add(a.edicao); });
const SINAL = Object.fromEntries(SINAIS.map(s=>[s.k,s]));
const NOME_VIG = Object.fromEntries(FAIXAS_VIG.map(f=>[f.k,f.nome]));
const NOME_ATR = Object.fromEntries(FAIXAS_ATR.map(f=>[f.k,f.nome]));
const MQ = window.matchMedia('(max-width: 700px)');

/* ====== estado ====== */
const S = { view:'geral', q:'', orgao:'', tipo:'', sinal:'', valor:'', vig:'', atr:'',
            de:DIAS[0]||'', ate:DIAS[DIAS.length-1]||'', dia:DIAS[DIAS.length-1]||'',
            sort:{k:'dia',dir:-1}, abertos:new Set(), limite:60, barMode:{}, expand:{} };
try{ const h=JSON.parse(decodeURIComponent(location.hash.slice(1))||'{}');
  if(h.view) S.view=h.view; if(DIAS.includes(h.dia)) S.dia=h.dia; if(DIAS.includes(h.de)) S.de=h.de; if(DIAS.includes(h.ate)) S.ate=h.ate; }catch(e){}
const diasAtivos = () => DIAS.filter(d=>d>=S.de && d<=S.ate);
const periodoTodo = () => S.de===DIAS[0] && S.ate===DIAS[DIAS.length-1];

function filtrar(ignorar){
  const termos = semAcento(S.q).split(/\s+/).filter(Boolean);
  return ATOS.filter(a=>{
    if(a.dia && (a.dia<S.de || a.dia>S.ate)) return false;
    if(ignorar!=='orgao' && S.orgao && a.orgao!==S.orgao) return false;
    if(ignorar!=='tipo' && S.tipo && a.tipo!==S.tipo) return false;
    if(ignorar!=='sinal' && S.sinal && !a.sinais.includes(S.sinal)) return false;
    if(ignorar!=='vig' && S.vig && a.fvig!==S.vig) return false;
    if(ignorar!=='atr' && S.atr && a.fatr!==S.atr) return false;
    if(S.valor){ const v=+S.valor; if(v<0){ if(a.valor!=null) return false; } else if(!(a.valor>=v)) return false; }
    for(const t of termos) if(!a._busca.includes(t)) return false;
    return true;
  });
}
const soma = (l,f=a=>!a.orc) => l.reduce((s,a)=>s+((f(a)&&a.valor)||0),0);

/* ====== componentes ====== */
function tags(a,max){
  const l=max?a.sinais.slice(0,max):a.sinais; const resto=a.sinais.length-l.length;
  return l.map(k=>`<span class="tag" style="color:var(${SINAL[k].cor})">${SINAL[k].nome}</span>`).join('')
    + (resto>0?`<span class="tag" style="color:var(--faint)" title="${a.sinais.slice(max).map(k=>SINAL[k].nome).join(', ')}">+${resto}</span>`:'');
}
function realce(txt){
  const ts = semAcento(S.q).split(/\s+/).filter(t=>t.length>1);
  let h = esc(txt); if(!ts.length) return h;
  const base = semAcento(h);
  const marcas=[]; ts.forEach(t=>{ const e=esc(t); let i=0; while((i=base.indexOf(e,i))>-1){ marcas.push([i,i+e.length]); i+=e.length; } });
  if(!marcas.length) return h;
  marcas.sort((x,y)=>x[0]-y[0]); let out='',p=0;
  marcas.forEach(([i,j])=>{ if(i<p) return; out+=h.slice(p,i)+'<mark>'+h.slice(i,j)+'</mark>'; p=j; });
  return out+h.slice(p);
}

function hbars(id, titulo, grupos, campo, opts={}){
  const {modo:mostrarModo=true, ordemFixa=false, nota='', todos=false} = opts;
  const modo = S.barMode[id]||'q';
  const ord = ordemFixa ? grupos : [...grupos].sort((x,y)=> modo==='q' ? (y.q-x.q||y.v-x.v) : (y.v-x.v||y.q-x.q));
  const max = Math.max(1,...ord.map(g=>modo==='q'?g.q:g.v));
  const lim = (todos||S.expand[id]) ? ord.length : 8;
  const sel = S[campo];
  const linhas = ord.slice(0,lim).map(g=>{
    const val = modo==='q'?g.q:g.v;
    const rot = modo==='q' ? fN(g.q) : fCurto(g.v);
    return `<div class="hb ${sel===g.k?'on':''}" data-f="${campo}" data-val="${esc(g.k)}" title="${esc(g.nome)} — ${fN(g.q)} atos · ${fBRL(g.v)}">
      <span class="n">${esc(g.nome)}</span><span class="t"><i style="width:${(val/max*100).toFixed(1)}%"></i></span><span class="q">${rot}</span></div>`;
  }).join('');
  const seg = mostrarModo ? `<span class="seg"><button data-bm="${id}" data-m="q" class="${modo==='q'?'on':''}">Qtde</button><button data-bm="${id}" data-m="v" class="${modo==='v'?'on':''}">Valor</button></span>` : '';
  const mais = (!todos && ord.length>8) ? `<button class="more" data-exp="${id}">${S.expand[id]?'Mostrar menos':'Ver todos ('+ord.length+')'}</button>` : '';
  return `<h2><span>${titulo}${nota?` <small>${nota}</small>`:''}</span>${seg}</h2><div class="hbars">${linhas||'<div class="empty">Nada com esses filtros</div>'}</div>${mais}`;
}
function agrupar(lista, chave){
  const m=new Map();
  lista.forEach(a=>{ const k=chave(a); if(!m.has(k)) m.set(k,{k,nome:k,q:0,v:0}); const g=m.get(k); g.q++; if(!a.orc) g.v+=a.valor||0; });
  return [...m.values()];
}
function gruposSinais(lista){
  return SINAIS.map(s=>{ const l=lista.filter(a=>a.sinais.includes(s.k)); return {k:s.k,nome:s.nome,q:l.length,v:soma(l)}; }).filter(g=>g.q);
}
function gruposFaixa(lista, faixas, campo){
  return faixas.map(f=>{ const l=lista.filter(a=>a[campo]===f.k); return {k:f.k,nome:f.nome,q:l.length,v:soma(l)}; }).filter(g=>g.q);
}

function kpis(lista){
  const contr = soma(lista), orc = soma(lista,a=>a.orc);
  const l27 = lista.filter(a=>a.sinais.includes('2027'));
  const nPos = lista.filter(a=>a.sinais.includes('pos')).length;
  const nAtr = lista.filter(a=>a.sinais.includes('atr')).length;
  const orgs = new Set(lista.map(a=>a.orgao)).size;
  const med = mediana(lista.map(a=>a.atraso).filter(x=>x!=null && x>=0));
  return `<div class="kpis">
    <div class="kpi"><div class="l">Atos registrados</div><div class="v">${fN(lista.length)}</div><div class="h">${orgs} órgãos</div></div>
    <div class="kpi"><div class="l">Valor em contratações</div><div class="v">${fCurto(contr)}</div><div class="h">contratos, aditivos, adesões etc.</div></div>
    <div class="kpi"><div class="l">Créditos e normas</div><div class="v">${fCurto(orc)}</div><div class="h">valor orçamentário, somado à parte</div></div>
    <div class="kpi"><div class="l">Avançam sobre ${ANO_FIM+1}</div><div class="v">${fN(l27.length)}</div><div class="h">${soma(l27)?fCurto(soma(l27))+' comprometidos':'vigência após '+fDM(CONFIG.fimMandato)}</div></div>
    <div class="kpi"><div class="l">Assinados após a eleição</div><div class="v">${fN(nPos)}</div><div class="h">${fN(nAtr)} publicados com atraso</div></div>
    <div class="kpi"><div class="l">Ato → publicação</div><div class="v">${med==null?'—':fN(med)+(med===1?' dia':' dias')}</div><div class="h">mediana entre assinatura e DOE</div></div>
  </div>`;
}

/* leitura rápida: frases calculadas a partir dos atos filtrados */
function leitura(lista){
  const fr = [];
  const contr = lista.filter(a=>!a.orc && a.valor!=null);
  const total = soma(lista);
  if(contr.length>=5 && total){
    const top5 = [...contr].sort((x,y)=>y.valor-x.valor).slice(0,5); const s5=top5.reduce((s,a)=>s+a.valor,0);
    fr.push({t:`Os <b>5 maiores valores</b> somam <b>${fCurto(s5)}</b>, ou <b>${fPct(s5/total)}</b> de tudo em contratações.`, f:['sinal','alto']});
  }
  const l27 = lista.filter(a=>a.sinais.includes('2027'));
  if(l27.length){ const v=soma(l27);
    fr.push({t:`<b>${fN(l27.length)} atos</b> têm vigência além de ${fDM(CONFIG.fimMandato)}${v?` e comprometem <b>${fCurto(v)}</b>${total?` (${fPct(v/total)} do valor em contratações)`:''}`:''}.`, f:['sinal','2027']}); }
  const porOrg = agrupar(lista,a=>a.orgao);
  if(porOrg.length>1 && total){
    const mv=[...porOrg].sort((x,y)=>y.v-x.v)[0], mq=[...porOrg].sort((x,y)=>y.q-x.q)[0];
    fr.push({t:`<b>${esc(mv.nome)}</b> concentra o maior valor (<b>${fCurto(mv.v)}</b>, ${fPct(mv.v/total)})${mq.k!==mv.k?`; <b>${esc(mq.nome)}</b> tem mais atos (${fN(mq.q)})`:''}.`, f:['orgao',mv.k]});
  }
  const pos = lista.filter(a=>a.sinais.includes('pos')); const vpos=soma(pos);
  if(vpos) fr.push({t:`<b>${fCurto(vpos)}</b> em contratações foram assinados depois da eleição (${fData(CONFIG.eleicao)}).`, f:['sinal','pos']});
  const atrs = lista.filter(a=>a.atraso!=null && a.atraso>30);
  if(atrs.length){ const mx=[...atrs].sort((x,y)=>y.atraso-x.atraso)[0];
    fr.push({t:`<b>${fN(atrs.length)} atos</b> saíram no DOE mais de 30 dias depois de assinados; o maior intervalo é de <b>${fN(mx.atraso)} dias</b> (${esc(mx.orgao)}: ${esc(curta(mx.descricao,60))}).`, ir:mx.id}); }
  const slic = lista.filter(a=>a.sinais.includes('slic'));
  if(slic.length) fr.push({t:`<b>${fN(slic.length)} atos</b> sem licitação própria (inexigibilidade, dispensa ou adesão a ata)${soma(slic)?` somam <b>${fCurto(soma(slic))}</b>`:''}.`, f:['sinal','slic']});
  const sval = lista.filter(a=>a.sinais.includes('sval'));
  if(sval.length) fr.push({t:`<b>${fN(sval.length)} extratos</b> de contratos, aditivos ou convênios foram publicados <b>sem valor</b>.`, f:['sinal','sval']});
  const rec = new Set(lista.filter(a=>a.recorrente).map(a=>a._ck));
  if(rec.size) fr.push({t:`<b>${fN(rec.size)} contratadas</b> aparecem em mais de um dia do período.`, f:['sinal','rec']});
  const opc = lista.filter(a=>a.sinais.includes('opc'));
  if(opc.length) fr.push({t:`<b>${fN(opc.length)} atos</b> citam operação de crédito (fonte 754/empréstimo)${soma(opc)?`, somando <b>${fCurto(soma(opc))}</b>`:''}.`, f:['sinal','opc']});
  if(!fr.length) return '';
  return `<div class="card c12"><h2><span>Leitura rápida <small>calculada a partir dos filtros atuais · toque para filtrar</small></span></h2><ul class="insights">${
    fr.map(x=>`<li class="lk" ${x.f?`data-f="${x.f[0]}" data-val="${esc(x.f[1])}" data-forca="1"`:`data-ir="${x.ir}"`}>${x.t}</li>`).join('')}</ul></div>`;
}

function topValores(lista, n=8){
  const l = lista.filter(a=>a.valor!=null && !a.orc).sort((x,y)=>y.valor-x.valor).slice(0,n);
  if(!l.length) return '<div class="empty">Nenhum valor com esses filtros</div>';
  return `<ul class="toplist">${l.map(a=>`<li data-ir="${a.id}"><div><div class="tt">${esc(a.descricao)}</div><div class="mm">${esc(a.orgao)} · ${fDM(a.dia)}${a.contratada?' · '+esc(a.contratada.slice(0,60)):''}</div></div><div class="vv">${fCurto(a.valor)}</div></li>`).join('')}</ul>`;
}
function recorrentes(lista){
  const m=new Map();
  lista.filter(a=>a.recorrente).forEach(a=>{ if(!m.has(a._ck)) m.set(a._ck,{nome:a.contratada.split(/[;(]/)[0].trim(),dias:new Set(),q:0,v:0}); const g=m.get(a._ck); g.dias.add(a.dia); g.q++; g.v+=a.valor||0; });
  const l=[...m.values()].sort((x,y)=>y.dias.size-x.dias.size||y.v-x.v).slice(0,8);
  if(!l.length) return '<div class="empty">Nenhuma contratada aparece em mais de um dia</div>';
  return `<ul class="toplist">${l.map(g=>`<li data-busca="${esc(g.nome)}"><div><div class="tt">${esc(g.nome)}</div><div class="mm">${[...g.dias].sort().map(fDM).join(', ')} · ${g.q} atos</div></div><div class="vv">${g.v?fCurto(g.v):'—'}</div></li>`).join('')}</ul>`;
}
function colunasDias(lista){
  const porDia = diasAtivos().map(d=>{ const l=lista.filter(a=>a.dia===d); return {d,q:l.length,v:soma(l)}; });
  const mq=Math.max(1,...porDia.map(x=>x.q)), mv=Math.max(1,...porDia.map(x=>x.v));
  return `<div class="colsw"><div class="cols">${porDia.map(x=>`<div class="col" data-dia="${x.d}" title="${fData(x.d)} — ${x.q} atos · ${fBRL(x.v)} em contratações">
      <div class="bar" style="height:${(x.q/mq*100*.78).toFixed(1)}%"><span class="lab">${x.q}</span></div>
      <div class="vb"><i style="width:${(x.v/mv*100).toFixed(1)}%"></i></div>
      <div class="d">${fDM(x.d)}</div><div class="w">${DIAS_SEM[dt(x.d).getDay()]} · ${fCurto(x.v)}</div></div>`).join('')}</div></div>
    <div class="legend"><span><i style="background:var(--bar)"></i>atos no dia</span><span><i style="background:var(--s1)"></i>valor em contratações (proporção)</span><span>toque num dia para abrir</span></div>`;
}

/* ====== tabela / lista ====== */
function ordenar(l){
  const {k,dir}=S.sort;
  return [...l].sort((x,y)=>{
    let a=x[k],b=y[k];
    if(k==='valor'){ a=a??-1; b=b??-1; return (a-b)*dir; }
    if(k==='dia'){ const c=(a||'').localeCompare(b||''); return c? c*dir : (parseFloat(x.n)-parseFloat(y.n)); }
    if(k==='pagina'){ const pa=parseInt((x.pagina||'').match(/\d+/)||9e9), pb=parseInt((y.pagina||'').match(/\d+/)||9e9); return ((x.edicao||'').localeCompare(y.edicao||'') || pa-pb)*dir; }
    return String(a||'').localeCompare(String(b||''),'pt-BR')*dir || (x.dia||'').localeCompare(y.dia||'');
  });
}
function tabela(lista, titulo, mostrarDia=true){
  const l = ordenar(lista);
  const vis = l.slice(0,S.limite);
  const pager = l.length>S.limite ? `<div class="pager"><button class="btn" id="bMais">Mostrar mais (${l.length-S.limite} restantes)</button></div>` : '';
  const head = `<div class="tablehead"><h2>${titulo} <span style="color:var(--muted);font-weight:400">· ${fN(l.length)}</span></h2><span style="font-size:12px;color:var(--faint)">${MQ.matches?'toque para ver detalhes':'clique numa linha para ver motivo e detalhes'}</span></div>`;
  if(!l.length) return `<div class="card tablecard c12">${head}<div class="empty">Nenhum ato com esses filtros</div></div>`;
  if(MQ.matches){
    const itens = vis.map(a=>{
      const ab=S.abertos.has(a.id);
      const ref = [mostrarDia?fDM(a.dia):'', fPag(a)?linkPag(a,esc(fPag(a))):''].filter(Boolean).join(' · ');
      return `<div class="mrow ${ab?'open':''}" data-id="${a.id}">
        <div class="mt"><span><b>${esc(a.orgao)}</b> · ${esc(a.tipo)}</span><span class="mv">${a.valor!=null?fCurto(a.valor):''}</span></div>
        <div class="md">${realce(a.descricao)}</div>
        ${a.contratada?`<div class="mc">${realce(a.contratada)}</div>`:''}
        <div class="mt" style="margin-top:4px"><span>${ref}${a.edicao?` · ed. ${esc(a.edicao)}`:''}</span></div>
        ${a.sinais.length?`<div class="mg">${tags(a,3)}</div>`:''}
      </div>${ab?`<div class="mdet">${detalhe(a)}</div>`:''}`;
    }).join('');
    return `<div class="card tablecard c12">${head}<div class="mlist">${itens}</div>${pager}</div>`;
  }
  const cols = [
    mostrarDia&&{k:'dia',t:'Dia',s:true}, {k:'pagina',t:mostrarDia?'Ed. / pág.':'Página',s:true},
    {k:'orgao',t:'Órgão',s:true},{k:'tipo',t:'Tipo',s:true},{k:'descricao',t:'Descrição / objeto'},
    {k:'contratada',t:'Contratada ou nomeado'},{k:'valor',t:'Valor',s:true,num:true},{k:'sinais',t:'Sinais'}
  ].filter(Boolean);
  const corpo = vis.map(a=>{
    const aberto = S.abertos.has(a.id);
    const pg = fPag(a);
    let h = `<tr class="row ${aberto?'open':''}" data-id="${a.id}">
      ${mostrarDia?`<td class="small">${fDM(a.dia)}</td>`:''}
      <td class="pg">${pg?linkPag(a,esc(pg)):'<span style="color:var(--faint)">—</span>'}${mostrarDia&&a.edicao?`<span class="ed">ed. ${esc(a.edicao)}</span>`:''}</td>
      <td>${esc(a.orgao)}</td><td class="small" style="white-space:normal">${esc(a.tipo)}</td>
      <td><div class="clamp">${realce(a.descricao)}</div></td>
      <td><div class="clamp">${realce(a.contratada)||'<span style="color:var(--faint)">—</span>'}</div></td>
      <td class="num">${a.valor!=null?fBRL(a.valor):'<span style="color:var(--faint)">—</span>'}</td>
      <td>${tags(a,3)}</td></tr>`;
    if(aberto) h += `<tr class="det"><td colspan="${cols.length}">${detalhe(a)}</td></tr>`;
    return h;
  }).join('');
  const ths = cols.map(c=>`<th class="${c.s?'s':''}" data-sort="${c.s?c.k:''}" style="${c.num?'text-align:right':''}">${c.t}${S.sort.k===c.k?` <span class="ar">${S.sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  return `<div class="card tablecard c12">${head}<div class="tscroll"><table><thead><tr>${ths}</tr></thead><tbody>${corpo}</tbody></table></div>${pager}</div>`;
}
function detalhe(a){
  const vig = a.vigencia ? fData(a.vigencia) : (a.vigencia_txt||'—');
  const atr = a.atraso!=null ? `${a.atraso} dia${a.atraso===1?'':'s'}` : '—';
  const pg = fPag(a);
  return `<div class="det-grid"><div>
      <h4>Descrição / objeto</h4><p>${realce(a.descricao)||'—'}</p>
      ${a.motivo?`<h4>Motivo da atenção</h4><p class="motivo">${realce(a.motivo)}</p>`:''}
      ${a.obs?`<h4>Observações</h4><p>${realce(a.obs)}</p>`:''}
      ${a.contratada?`<h4>Contratada ou nomeado</h4><p>${realce(a.contratada)}</p>`:''}
    </div><div><dl>
      <dt>Edição</dt><dd>${esc(a.edicao)||'—'}</dd>
      <dt>Página</dt><dd>${pg?linkPag(a,esc(pg)):'—'}</dd>
      <dt>Item</dt><dd>${esc(a.n)||'—'}</dd>
      <dt>Data do ato</dt><dd>${fData(a.data_ato)}</dd>
      <dt>Publicação</dt><dd>${fData(a.data_pub)}</dd>
      <dt>Ato → publicação</dt><dd>${atr}</dd>
      <dt>Vigência até</dt><dd>${esc(vig)}</dd>
      <dt>Valor</dt><dd>${fBRL(a.valor)}${a.orc&&a.valor!=null?' (orçamentário)':''}</dd>
      ${a.modalidade?`<dt>Modalidade</dt><dd>${esc(a.modalidade)}</dd>`:''}
      ${a.nivel?`<dt>Nível</dt><dd>${esc(a.nivel)}</dd>`:''}
      ${a.status?`<dt>Status</dt><dd>${esc(a.status)}</dd>`:''}
      <dt>Arquivo</dt><dd>${esc(a.arquivo)}</dd>
    </dl><div style="margin-top:10px">${tags(a)}</div></div></div>`;
}

/* ====== views ====== */
function renderGeral(){
  const l = filtrar();
  $('#vGeral').innerHTML = kpis(l) + `<div class="grid">
    ${leitura(l)}
    <div class="card c7"><h2>Atos por dia de publicação</h2>${colunasDias(l)}</div>
    <div class="card c5">${hbars('sinal','Sinais',gruposSinais(filtrar('sinal')),'sinal',{modo:false,todos:true})}</div>
    <div class="card c6">${hbars('orgao','Por órgão',agrupar(filtrar('orgao'),a=>a.orgao),'orgao')}</div>
    <div class="card c6">${hbars('tipo','Por tipo de ato',agrupar(filtrar('tipo'),a=>a.tipo),'tipo')}</div>
    <div class="card c6">${hbars('vig','Até quando vão os compromissos',gruposFaixa(filtrar('vig'),FAIXAS_VIG,'fvig'),'vig',{ordemFixa:true,nota:'pela vigência informada'})}</div>
    <div class="card c6">${hbars('atr','Tempo entre assinatura e publicação',gruposFaixa(filtrar('atr'),FAIXAS_ATR,'fatr'),'atr',{ordemFixa:true})}</div>
    <div class="card c7"><h2>Maiores valores em contratações</h2>${topValores(l)}</div>
    <div class="card c5"><h2>Contratadas em mais de um dia</h2>${recorrentes(l)}</div>
    ${tabela(l,'Todos os atos')}
  </div>`;
}
function destaque(a,i){
  const vig = a.vigencia ? fData(a.vigencia) : (a.vigencia_txt||'');
  const pg = fPag(a);
  return `<article class="hlc">
    <div class="hd"><div><div class="rk">${i+1}º maior valor</div><div class="v">${fBRL(a.valor)}</div></div>
      <div class="og"><b>${esc(a.orgao)}</b>${esc(a.tipo)}</div></div>
    <div class="bd">
      <div class="sec"><h5>Objeto</h5><p>${realce(a.descricao)}</p></div>
      ${a.contratada?`<div class="sec"><h5>Contratada</h5><p>${realce(a.contratada)}</p></div>`:''}
      ${a.motivo?`<div class="sec why"><h5>Por que chama atenção</h5><p>${realce(a.motivo)}</p></div>`:''}
      ${a.obs?`<div class="sec"><h5>Observações</h5><p>${realce(a.obs)}</p></div>`:''}
      <div class="meta">
        ${a.edicao?`<span>Edição <b>${esc(a.edicao)}</b>${pg?' · '+linkPag(a,`<b>${esc(pg)}</b>`):''}</span>`:''}
        ${a.data_ato?`<span>Assinado <b>${fDM(a.data_ato)}</b>${a.atraso!=null?` (${a.atraso} d até o DOE)`:''}</span>`:''}
        ${vig?`<span>Vigência <b>${esc(vig)}</b></span>`:''}
      </div>
    </div>
    <div class="ft"><div>${tags(a)}</div><button data-ir="${a.id}">Ver na lista ↓</button></div>
  </article>`;
}
function renderDia(){
  const ativos = diasAtivos();
  if(!ativos.includes(S.dia)) S.dia = ativos[ativos.length-1]||'';
  const d = S.dia;
  const pills = ativos.map(x=>`<button class="daypill" data-dia="${x}" aria-pressed="${x===d}"><div class="d">${fDM(x)} <span style="font-weight:400;color:var(--muted)">${DIAS_SEM[dt(x).getDay()]}</span></div><div class="m">${EDICAO_DIA[x]?'ed. '+[...EDICAO_DIA[x]].join(', '):'&nbsp;'}</div></button>`).join('');
  const strip = `<div class="daystrip" id="strip"><button class="btn nav" data-nav="-1" title="Dia anterior (←)">‹</button>${pills}<button class="btn nav" data-nav="1" title="Próximo dia (→)">›</button></div>`;
  if(!d){ $('#vDia').innerHTML = strip+'<div class="empty">Nenhum dia no período escolhido</div>'; return; }
  const ldia = filtrar().filter(a=>a.dia===d);
  const todosDia = ATOS.filter(a=>a.dia===d);
  const destaques = ldia.filter(a=>a.valor!=null && !a.orc).sort((x,y)=>y.valor-x.valor).slice(0,3);
  const orcDia = soma(ldia,a=>a.orc);
  const hl = destaques.length ? `<div class="card c12"><h2>Destaques do dia</h2><div class="hl">${destaques.map(destaque).join('')}</div></div>` : '';
  $('#vDia').innerHTML = strip + `<div class="dayhead"><h2>${DIAS_SEM_L[dt(d).getDay()]}, ${fData(d)}</h2><span class="m">${EDICAO_DIA[d]?'Edição '+[...EDICAO_DIA[d]].join(', ')+' · ':''}${fN(ldia.length)}${ldia.length!==todosDia.length?' de '+fN(todosDia.length):''} atos${orcDia?' · '+fCurto(orcDia)+' em créditos/normas':''}</span></div>`
    + kpis(ldia) + `<div class="grid">${hl}
      <div class="card c4">${hbars('dOrgao','Por órgão',agrupar(ldia,a=>a.orgao),'orgao')}</div>
      <div class="card c4">${hbars('dTipo','Por tipo',agrupar(ldia,a=>a.tipo),'tipo')}</div>
      <div class="card c4">${hbars('dSinal','Sinais',gruposSinais(ldia),'sinal',{modo:false,todos:true})}</div>
      ${tabela(ldia,'Atos do dia',false)}</div>`;
  const p = document.querySelector('.daypill[aria-pressed="true"]');
  if(p){ const st=$('#strip'); st.scrollLeft = p.offsetLeft - st.clientWidth/2 + p.clientWidth/2; }
}
function nFiltrosAtivos(){ return ['q','orgao','tipo','sinal','valor','vig','atr'].filter(k=>S[k]).length + (periodoTodo()?0:1); }
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===S.view));
  $('#vGeral').hidden = S.view!=='geral'; $('#vDia').hidden = S.view!=='dia';
  const l = filtrar();
  $('#count').textContent = (l.length===ATOS.length ? fN(ATOS.length)+' atos' : fN(l.length)+' de '+fN(ATOS.length)+' atos');
  const ch=[];
  if(!periodoTodo()) ch.push(['periodo','Período', S.de===S.ate?fDM(S.de):fDM(S.de)+' a '+fDM(S.ate)]);
  if(S.q) ch.push(['q','Busca',S.q]);
  if(S.orgao) ch.push(['orgao','Órgão',S.orgao]);
  if(S.tipo) ch.push(['tipo','Tipo',S.tipo]);
  if(S.sinal) ch.push(['sinal','Sinal',SINAL[S.sinal].nome]);
  if(S.vig) ch.push(['vig','Vigência',NOME_VIG[S.vig]]);
  if(S.atr) ch.push(['atr','Ato → DOE',NOME_ATR[S.atr]]);
  if(S.valor) ch.push(['valor','Valor',$('#fValor').selectedOptions[0].text]);
  $('#chips').innerHTML = ch.map(([k,t,v])=>`<button class="chip" data-limpa="${k}">${t}: <b>${esc(v)}</b><span class="x">×</span></button>`).join('') + (ch.length>1?`<button class="chip" data-limpa="*" style="background:none;border:1px solid var(--line);color:var(--muted)">Limpar tudo</button>`:'');
  $('#chips').style.display = ch.length?'flex':'none';
  const n = nFiltrosAtivos(); $('#nFiltros').hidden = !n; $('#nFiltros').textContent = n;
  if(S.view==='geral') renderGeral(); else renderDia();
  try{ history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify({view:S.view,dia:S.dia,de:S.de,ate:S.ate}))); }catch(e){}
}

/* ====== filtros ====== */
function opcoes(sel, valores, rot=v=>v){
  const atual = sel.value; const prim = sel.options[0].outerHTML;
  sel.innerHTML = prim + valores.map(v=>`<option value="${esc(v.k??v)}">${esc(rot(v))}</option>`).join(''); sel.value=atual;
}
function montarFiltros(){
  const cont = c => { const m={}; ATOS.forEach(a=>m[a[c]]=(m[a[c]]||0)+1); return Object.entries(m).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'pt-BR')); };
  opcoes($('#fOrgao'), cont('orgao').map(([k,n])=>({k,n})), v=>`${v.k} (${v.n})`);
  opcoes($('#fTipo'), cont('tipo').map(([k,n])=>({k,n})), v=>`${v.k} (${v.n})`);
  opcoes($('#fSinal'), SINAIS.map(s=>({k:s.k,n:ATOS.filter(a=>a.sinais.includes(s.k)).length,nome:s.nome})).filter(s=>s.n), v=>`${v.nome} (${v.n})`);
  const od = DIAS.map(d=>`<option value="${d}">${fDM(d)} (${DIAS_SEM[dt(d).getDay()]})</option>`).join('');
  $('#fDe').innerHTML = od; $('#fAte').innerHTML = od; $('#fDe').value=S.de; $('#fAte').value=S.ate;
}
function setF(k,v){
  S[k]=v; S.limite=60;
  const map={orgao:'#fOrgao',tipo:'#fTipo',sinal:'#fSinal',valor:'#fValor',q:'#q'}; if(map[k]) $(map[k]).value=v;
  render();
}
function setPeriodo(de,ate){
  if(de>ate) [de,ate]=[ate,de];
  S.de=de; S.ate=ate; $('#fDe').value=de; $('#fAte').value=ate; S.limite=60; render();
}
function limparTudo(){
  ['q','orgao','tipo','sinal','valor','vig','atr'].forEach(k=>{S[k]='';});
  ['#q','#fOrgao','#fTipo','#fSinal','#fValor'].forEach(s=>$(s).value='');
  setPeriodo(DIAS[0],DIAS[DIAS.length-1]);
}

/* ====== eventos ====== */
let tq; $('#q').addEventListener('input',e=>{ clearTimeout(tq); tq=setTimeout(()=>{S.q=e.target.value.trim(); S.limite=60; render();},180); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
$('#fOrgao').onchange=e=>setF('orgao',e.target.value);
$('#fTipo').onchange=e=>setF('tipo',e.target.value);
$('#fSinal').onchange=e=>setF('sinal',e.target.value);
$('#fValor').onchange=e=>setF('valor',e.target.value);
$('#fDe').onchange=e=>setPeriodo(e.target.value,S.ate);
$('#fAte').onchange=e=>setPeriodo(S.de,e.target.value);
$('#bFiltros').onclick=()=>{ const f=$('#filters'); const on=!f.classList.contains('aberto'); f.classList.toggle('aberto',on); $('#bFiltros').setAttribute('aria-expanded',on); };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.view=t.dataset.v; render(); window.scrollTo({top:0});});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-limpa],[data-f],[data-bm],[data-exp],[data-dia],[data-nav],[data-ir],[data-busca],th.s,tr.row,.mrow,#bMais');
  if(!t) return;
  if(t.dataset.limpa){ const k=t.dataset.limpa; if(k==='*') limparTudo(); else if(k==='periodo') setPeriodo(DIAS[0],DIAS[DIAS.length-1]); else setF(k,''); return; }
  if(t.dataset.f){ setF(t.dataset.f, (S[t.dataset.f]===t.dataset.val && !t.dataset.forca)?'':t.dataset.val); return; }
  if(t.dataset.bm){ S.barMode[t.dataset.bm]=t.dataset.m; render(); return; }
  if(t.dataset.exp){ S.expand[t.dataset.exp]=!S.expand[t.dataset.exp]; render(); return; }
  if(t.dataset.dia && t.classList.contains('col')){ S.dia=t.dataset.dia; S.view='dia'; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.dia){ S.dia=t.dataset.dia; render(); return; }
  if(t.dataset.nav){ irDia(+t.dataset.nav); return; }
  if(t.dataset.ir){ const id=t.dataset.ir; S.abertos.add(id);
    const lista = S.view==='dia' ? ordenar(filtrar().filter(a=>a.dia===S.dia)) : ordenar(filtrar());
    const pos = lista.findIndex(a=>a.id===id); if(pos>=S.limite) S.limite=pos+20;
    render(); const r=document.querySelector(`[data-id="${CSS.escape(id)}"]`); if(r) r.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(t.dataset.busca){ setF('q',t.dataset.busca); return; }
  if(t.matches('th.s')){ const k=t.dataset.sort; S.sort = S.sort.k===k ? {k,dir:-S.sort.dir} : {k,dir:(k==='valor'||k==='dia')?-1:1}; render(); return; }
  if(t.id==='bMais'){ S.limite+=100; render(); return; }
  if(t.matches('tr.row,.mrow')){ const id=t.dataset.id; S.abertos.has(id)?S.abertos.delete(id):S.abertos.add(id); render(); return; }
});
function irDia(passo){ const at=diasAtivos(); const i=at.indexOf(S.dia); const j=Math.min(at.length-1,Math.max(0,i+passo)); if(j!==i){S.dia=at[j]; render();} }
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')) return;
  if(S.view==='dia' && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ irDia(e.key==='ArrowLeft'?-1:1); }
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
});
/* gesto de arrastar para o lado troca o dia no celular */
(function(){ let x0=null,y0=null;
  $('#vDia').addEventListener('touchstart',e=>{ if(e.target.closest('.daystrip,.tscroll,.colsw')) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  $('#vDia').addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2) irDia(dx<0?1:-1); },{passive:true});
})();
(MQ.addEventListener ? MQ.addEventListener('change',()=>render()) : MQ.addListener(()=>render()));
$('#bTema').onclick=()=>{
  const r=document.documentElement; const escuro = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = escuro?'light':'dark'; try{localStorage.setItem('tema',r.dataset.theme);}catch(e){}
};
try{ const t=localStorage.getItem('tema'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
$('#bApr').onclick=()=>{
  const on=!document.body.classList.contains('present'); document.body.classList.toggle('present',on);
  $('#bApr').textContent = on?'Sair da apresentação':'Apresentar';
  try{ if(on && !document.fullscreenElement) document.documentElement.requestFullscreen?.(); else if(!on && document.fullscreenElement) document.exitFullscreen?.(); }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bApr').textContent='Apresentar'; }});
$('#bCsv').onclick=()=>{
  const l = S.view==='dia' ? filtrar().filter(a=>a.dia===S.dia) : filtrar();
  const cab=['Dia','Edição','Página','Nº','Data do ato','Data da publicação','Dias até publicar','Órgão','Tipo','Descrição / objeto','Contratada ou nomeado','Valor (R$)','Vigência até','Motivo da atenção','Observações','Sinais'];
  const linhas = ordenar(l).map(a=>[fData(a.dia),a.edicao,a.pagina,a.n,fData(a.data_ato),fData(a.data_pub),a.atraso??'',a.orgao,a.tipo,a.descricao,a.contratada,a.valor==null?'':String(a.valor).replace('.',','),a.vigencia?fData(a.vigencia):a.vigencia_txt,a.motivo,a.obs,a.sinais.map(k=>SINAL[k].nome).join('; ')]);
  const csv = '﻿'+[cab,...linhas].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const b = new Blob([csv],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=`atos-doe${S.view==='dia'?'-'+S.dia:''}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500);
};

/* ====== início ====== */
(function(){
  if(!ATOS.length){ $('#vGeral').innerHTML='<div class="empty">Sem dados. Rode <code>python3 painel/gerar.py</code> na pasta das planilhas.</div>'; return; }
  $('#nota').textContent = `Atualizado em ${PACOTE.gerado_em}`;
  const ph=()=>{ $('#q').placeholder = MQ.matches ? 'Buscar atos…' : 'Buscar em descrição, contratada, motivo…'; }; ph();
  (MQ.addEventListener ? MQ.addEventListener('change',ph) : MQ.addListener(ph));
  montarFiltros(); render();
})();
</script>
</body>
</html>
